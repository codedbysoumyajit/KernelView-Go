name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Go Vet
        run: go vet ./...

      - name: Build Binary
        run: go build -v -o kernelview .

      - name: Test Execution (Unix)
        if: matrix.os != 'windows-latest'
        run: ./kernelview --version

      - name: Test Execution (Windows)
        if: matrix.os == 'windows-latest'
        run: .\kernelview.exe --version
